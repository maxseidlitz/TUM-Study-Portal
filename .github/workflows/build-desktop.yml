name: Build Desktop Apps

# Baut bei jedem Push auf main unsignierte Windows- und macOS-Installer.
# Die Ollama-Runtime wird vor dem Build heruntergeladen und mitgepackt.
# Das KI-Modell (gemma4:e2b) wird NICHT gebündelt – die App lädt es beim
# ersten Start selbst herunter.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # npm install statt npm ci: toleriert geringfügige Lockfile-Drift
        # zwischen npm-Versionen, statt den Build hart abzubrechen.
        run: npm install --no-audit --no-fund

      - name: Download & bundle Ollama runtime
        shell: pwsh
        run: |
          # Feste Version + direkter Asset-Link (kein flakiger latest/download-Redirect)
          $version = "v0.24.0"
          $url = "https://github.com/ollama/ollama/releases/download/$version/ollama-windows-amd64.zip"
          New-Item -ItemType Directory -Force -Path "resources/ollama" | Out-Null
          Write-Host "Lade Ollama-Runtime $version ..."

          $ok = $false
          for ($i = 1; $i -le 5; $i++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile "ollama.zip" -MaximumRetryCount 3 -RetryIntervalSec 10
              if ((Test-Path "ollama.zip") -and (Get-Item "ollama.zip").Length -gt 10MB) {
                $ok = $true; break
              }
              Write-Host "Versuch ${i}: Datei zu klein / leer – neuer Versuch."
            } catch {
              Write-Host "Versuch ${i} fehlgeschlagen: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 15
          }
          if (-not $ok) { throw "Ollama-Download nach 5 Versuchen fehlgeschlagen." }

          Expand-Archive -Path "ollama.zip" -DestinationPath "resources/ollama" -Force
          Remove-Item "ollama.zip"

          # Falls das Archiv in einen Unterordner entpackt: ollama.exe nach oben holen
          if (-not (Test-Path "resources/ollama/ollama.exe")) {
            $exe = Get-ChildItem -Path "resources/ollama" -Recurse -Filter "ollama.exe" | Select-Object -First 1
            if ($exe) {
              Get-ChildItem -Path $exe.Directory.FullName | Move-Item -Destination "resources/ollama" -Force
            }
          }
          if (-not (Test-Path "resources/ollama/ollama.exe")) {
            throw "ollama.exe nach dem Entpacken nicht gefunden!"
          }
          Write-Host "Ollama-Runtime gebündelt."

      - name: Build React app
        run: npm run build
        env:
          # CRA behandelt Warnungen sonst als Fehler in CI
          CI: false

      - name: Build Windows installer (electron-builder)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TUM-Study-Portal-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download & bundle Ollama runtime
        run: |
          version="v0.24.0"
          url="https://github.com/ollama/ollama/releases/download/${version}/ollama-darwin.tgz"
          mkdir -p resources/ollama
          echo "Lade Ollama-Runtime ${version} ..."

          ok=false
          for i in 1 2 3 4 5; do
            if curl -fL --retry 3 --retry-delay 10 -o ollama.tgz "$url" \
              && [ -s ollama.tgz ] \
              && [ "$(wc -c < ollama.tgz | tr -d ' ')" -gt 10000000 ]; then
              ok=true
              break
            fi
            echo "Versuch ${i}: Download fehlgeschlagen oder Datei zu klein – neuer Versuch."
            sleep 15
          done
          if [ "$ok" != true ]; then
            echo "Ollama-Download nach 5 Versuchen fehlgeschlagen."
            exit 1
          fi

          tar -xzf ollama.tgz -C resources/ollama
          rm -f ollama.tgz
          chmod +x resources/ollama/ollama

          if [ ! -x resources/ollama/ollama ]; then
            found="$(find resources/ollama -name ollama -type f | head -1)"
            if [ -n "$found" ]; then
              mv "$(dirname "$found")"/* resources/ollama/ 2>/dev/null || true
              chmod +x resources/ollama/ollama
            fi
          fi
          if [ ! -x resources/ollama/ollama ]; then
            echo "ollama-Binary nach dem Entpacken nicht gefunden!"
            exit 1
          fi
          echo "Ollama-Runtime gebündelt."

      - name: Build React app
        run: npm run build
        env:
          CI: false

      - name: Build macOS app (electron-builder)
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsignierter Build ohne Apple-Developer-Zertifikat
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TUM-Study-Portal-macOS
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7
