name: Deploy Web App (GitHub Pages)

# Baut die React-App als statische PWA und veröffentlicht sie auf GitHub Pages,
# damit die iOS-WebApp per URL am Handy geöffnet und zum Homescreen hinzugefügt
# werden kann. Manuell auslösbar und automatisch bei Push auf den Default-Branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Electron-Binary wird für den Web-Build nicht benötigt.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build
        run: npm run build
        env:
          CI: 'false'
      # SPA-Fallback: 404 → index.html, damit Deep-Links nicht ins Leere laufen.
      - name: Add SPA 404 fallback
        run: cp build/index.html build/404.html
      - name: Disable Jekyll
        run: touch build/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
