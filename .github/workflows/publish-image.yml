name: Publish Docker Image (GHCR)

# Baut das Server-Image (server/ + Vite-Frontend, siehe Dockerfile) und
# veröffentlicht es in der GitHub Container Registry. Für Self-Hosting-Ziele
# wie ein ZimaBoard/CasaOS, die nur pullen statt selbst bauen sollen.
# Manuell auslösen und optional den zu bauenden Branch/Tag/SHA angeben.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/Tag/SHA zum Bauen (leer = Standard-Branch)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Compute lowercase image name
        # GHCR verlangt kleingeschriebene Image-Namen; github.repository enthält
        # hier Großbuchstaben (maxseidlitz/TUM-Study-Portal).
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3.11.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # ZimaBoard ist x86_64 (Intel Celeron N-Serie) — reicht amd64-only.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Summary
        run: |
          echo "### Image veröffentlicht" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
