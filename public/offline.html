<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <title>Offline – TUM Study Portal</title>
    <script src="./offline-locale.js" defer></script>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; --bg: #f4f6fb; --text: #172033; --muted: #5f6b7a; --accent: #3070b3; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f1117; --text: #f5f7fa; --muted: #b5bdc9; } }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; background: var(--bg); color: var(--text); }
      main { width: min(32rem, calc(100% - 2rem)); text-align: center; }
      img { width: 64px; height: 64px; margin-bottom: 1rem; border-radius: 14px; }
      h1 { margin-bottom: .5rem; }
      p { color: var(--muted); line-height: 1.5; }
      button { min-height: 44px; padding: .7rem 1rem; border: 0; border-radius: .5rem; background: var(--accent); color: white; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="./icons/icon-192.png" width="64" height="64" alt="" />
      <h1 id="offline-title">Du bist offline</h1>
      <p id="offline-body">Diese sichere Offline-Seite enthält keine persönlichen Daten. Stelle die Verbindung wieder her, um das Portal zu öffnen oder Änderungen zu speichern.</p>
      <form action="/" method="get"><button id="offline-retry" type="submit">Erneut versuchen</button></form>
    </main>
  </body>
</html>
