<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <title>Offline – TUM Study Portal</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; background: #0f1117; color: #f5f7fa; }
      main { width: min(32rem, calc(100% - 2rem)); text-align: center; }
      h1 { margin-bottom: .5rem; }
      p { color: #b5bdc9; line-height: 1.5; }
      button { min-height: 44px; padding: .7rem 1rem; border: 0; border-radius: .5rem; background: #3070b3; color: white; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Du bist offline</h1>
      <p>Diese sichere Offline-Seite enthält keine persönlichen Daten. Stelle die Verbindung wieder her, um das Portal zu öffnen oder Änderungen zu speichern.</p>
      <form action="/" method="get"><button type="submit">Erneut versuchen</button></form>
    </main>
  </body>
</html>
